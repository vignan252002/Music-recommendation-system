{% load static %}
{% include 'admin_header.html' %}

<!-- ##### Hero Area Start ##### -->
<section class="hero-area">
    <div class="hero-slides owl-carousel">
        <!-- Single Hero Slide -->
        <div class="single-hero-slide d-flex align-items-center justify-content-center">
            <!-- Slide Img -->
            <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-1.jpg' %});"></div>
            <!-- Slide Content -->
            <div class="hero-slides-content text-center">
                <p data-animation="fadeInUp" data-delay="300ms">Change Password</p>
            </div>
        </div>
    </div>

    <!-- bg gradients -->
    <div class="bg-gradients"></div>

    <!-- Slide Down -->
    <div class="slide-down" id="scrollDown">
        <h6>Slide Down</h6>
        <div class="line"></div>
    </div>
</section>

<!-- ##### Change Password Form Section ##### -->
<section class="contact-area mt-30 section-padding-100-0">
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-6">
                <div class="contact-content mb-100">
                    <!-- Contact Form Area -->
                    <div class="contact-form-area">
                        <form method="POST" id="contactForm" action="{% url 'admin_change_password' %}" name="contactForm" class="contactForm">
                            {% csrf_token %}
                            <div class="row">
                                <!-- Message Display -->
                                <div class="col-md-12">
                                    {% if msg %}
                                        <div style="margin-bottom: 15px; padding: 10px; background-color:red; border-left: 5px solid red; color: #e6ffe6;">
                                            <strong>{{ msg }}</strong>
                                        </div>
                                    {% endif %}
                                </div>

                                <!-- Email -->
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="email">Email</label>
                                        <input type="email" class="form-control" id="email" value="{{email}}" readonly>
                                    </div>
                                </div>

                                <!-- Old Password -->
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label">Old Password</label>
                                        <input type="password" class="form-control" name="old_password" placeholder="Old Password" required>
                                    </div>
                                </div>

                                <!-- New Password -->
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label">New Password</label>
                                        <input type="password" class="form-control" name="new_password" placeholder="New Password" required>
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <input type="submit" value="Change Password" class="btn btn-primary">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% include 'footer.html' %}
