<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Title -->
    <title>Musica - Music Template</title>

    <!-- Favicon -->
    <link rel="icon" href="{% static 'img/core-img/favicon.ico' %}">

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>
    <!-- ##### Preloader ##### -->
    <div class="preloader d-flex align-items-center justify-content-center">
        <div class="circle-preloader">
            <img src="{% static 'img/core-img/compact-disc.png' %}" alt="">
        </div>
    </div>

    <!-- ##### Header Area Start ##### -->
    {% include 'customer_header.html' %}
<section class="hero-area">
    <div class="hero-slides owl-carousel">

        <!-- Single Hero Slide -->
        <div class="single-hero-slide d-flex align-items-center justify-content-center">
            <!-- Slide Img -->
            <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-2.jpg' %});"></div>
            <!-- Slide Content -->
            <div class="hero-slides-content text-center">
                <p data-animation="fadeInUp" data-delay="300ms">Buy Plan</p>
            </div>
            <!-- Big Text -->
            <h2 class="big-text">Colorlib</h2>
        </div>

    </div>
    <!-- bg gradients -->
    <div class="bg-gradients"></div>

    <!-- Slide Down -->
    <div class="slide-down" id="scrollDown">
        <h6>Slide Down</h6>
        <div class="line"></div>
    </div>
</section>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <!-- Form Start -->
            <form method="post" class="bg-light p-4 rounded shadow-sm">
                {% csrf_token %}
                <div class="row">
                     {% if message %}
                <div class="alert alert-success text-center" role="alert">
                    {{ message }}
                </div>
            {% endif %}

                    <!-- Customer Email Field (Read-only) -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="customer_email">Customer Email:</label>
                            <input class="form-control" name="customer_email" id="customer_email" type="email" value="{{ email }}" readonly placeholder="Customer Email">
                        </div>
                    </div>

                    <!-- Subscription ID Field (Read-only) -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="subscription">Subscription ID:</label>
                            <input class="form-control" name="subscription" id="subscription" type="number" value="{{ plans.id }}" readonly placeholder="Subscription ID">
                        </div>
                    </div>

                    <!-- Start Date Field (Read-only) -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="startdate">Start Date:</label>
                            <input class="form-control" name="startdate" id="startdate" type="text" value="{{ startdate }}" readonly placeholder="Start Date" required>
                        </div>
                    </div>

                    <!-- End Date Field (Read-only) -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="enddate">End Date:</label>
                            <input class="form-control" name="enddate" id="enddate" type="text" value="{{ enddate }}" readonly placeholder="End Date" required>
                        </div>
                    </div>

                    <!-- Holder Name Field -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="holder_name">Card Holder Name:</label>
                            <input class="form-control" name="holder_name" id="holder_name" type="text" placeholder="Card Holder Name" required>
                        </div>
                    </div>

                    <!-- Card Number Field -->
                    <div class="col-12">
                        <div class="form-group">
                            <label for="card_number">Card Number:</label>
                            <input class="form-control" name="card_number" id="card_number" type="number" placeholder="Card Number" required>
                        </div>
                    </div>

                    <!-- CVV Number Field -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="cvv_number">CVV Number:</label>
                            <input class="form-control" name="cvv_number" id="cvv_number" type="number" placeholder="CVV Number" required>
                        </div>
                    </div>

                    <!-- Bank Name Field -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="bank_name">Bank Name:</label>
                            <input class="form-control" name="bank_name" id="bank_name" type="text" placeholder="Bank Name" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-block mt-4">Buy</button>
                    </div>

                </div>
            </form>
            <!-- Form End -->

        </div>
    </div>
</div>

{% include 'footer.html' %}
