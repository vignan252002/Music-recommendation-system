{% load static %}
{% include 'admin_header.html' %}
    <!-- ##### Hero Area Start ##### -->
    <section class="hero-area">
        <div class="hero-slides owl-carousel">
            <div class="single-hero-slide d-flex align-items-center justify-content-center">
                <!-- Slide Img -->
                <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-3.jpg' %});"></div>
                <!-- Slide Content -->
                <div class="hero-slides-content text-center">
                    <p data-animation="fadeInUp" data-delay="300ms">Add Song</p>
                </div>
            </div>

        </div>
        <!-- bg gradients -->
        <div class="bg-gradients"></div>

        <!-- Slide Down -->
        <div class="slide-down" id="scrollDown">
            <h6>Slide Down</h6>
            <div class="line"></div>
        </div>
    </section>
<section class="contact-area mt-30 section-padding-100-0">
        <div class="container">
            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="contact-content mb-100">
                        <!-- Contact Form Area -->
                        <div class="contact-form-area">
							<h6 style="color:green">{{msg}}</h6>
                            <form method="POST" id="contactForm" action="" name="contactForm" class="contactForm" enctype="multipart/form-data">
								{% csrf_token %}
								<div class="row">
									<div class="col-md-8">
										<div class="form-group">
											<label class="label" >Id</label>
											<input type="number" class="form-control" name="album" value="{{album.id}}" readonly>
										</div>
									</div>

									<div class="col-md-8">
										<div class="form-group">
											<label class="label" for="title">Title</label>
											<input type="text" class="form-control" name="title" id="title" placeholder="Title" required>
										</div>
									</div>

									<div class="col-md-8">
										<div class="form-group">
											<label class="label" for="singer">Singer</label>
											<input type="text" class="form-control" name="singer" id="singer" placeholder="Singer" required>
										</div>
									</div>


									<div class="col-md-8">
										<div class="form-group">
									<label class="label">Category</label> <br>
									<select name="category"  class="form-select"  style="font-size:16px; width:350px;height:40px; background-color:rgb(242, 242, 242); "  required>
										{% for i in category %}
										<option name="category"  value="{{i.category}}">{{i.category}}</option>
										{% endfor %}
									</select>
								</div>
							  	</div>

									<div class="col-md-8">
										<div class="form-group">
											<label class="label" for="director">Director</label>
											<input type="text" class="form-control" name="director" id="director" placeholder="Director" required>
										</div>
									</div>
									<div class="col-md-8">
										<div class="form-group">
											<label class="label" >Upload Song</label>
											<input type="file" class="form-control" name="file" required>
										</div>
									</div>
<!--									<div class="col-md-8">-->
<!--										<div class="form-group">-->
<!--											<label class="label" for="durationInput">Duration</label>-->
<!--											<input type="text" class="form-control" name="duration" id="durationInput" required>-->
<!--										</div>-->
									</div>
									<div class="col-md-12">
										<div class="form-group">
											<input type="submit" value="Add Song" class="btn btn-primary">
										</div>
									</div>

								</div>
							</form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

{% include 'footer.html' %}
<script>
  document.getElementById('durationInput').addEventListener('change', function() {
    const enteredValue = this.value;
    const durationRegex = /^([0-9]{2}):([0-5][0-9]):([0-5][0-9])$/; // HH:MM:SS format
    if (!durationRegex.test(enteredValue)) {
      alert('Please enter a valid duration in HH:MM:SS format.');
      this.value = ''; // Clear the input if the format is incorrect
    }
  });
</script>
