{% load static %}
{% include 'header.html' %}
    <section class="hero-area">
        <div class="hero-slides owl-carousel">

            <!-- Single Hero Slide -->
            <div class="single-hero-slide d-flex align-items-center justify-content-center">
                <!-- Slide Img -->
                <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-2.jpg' %});"></div>
                <!-- Slide Content -->
                <div class="hero-slides-content text-center">
                    <p data-animation="fadeInUp" data-delay="300ms">Admin Login</p>
                </div>
                <!-- Big Text -->
                <h2 class="big-text">Colorlib</h2>
            </div>

            <!-- Single Hero Slide -->


        </div>
        <!-- bg gradients -->
        <div class="bg-gradients"></div>

        <!-- Slide Down -->
        <div class="slide-down" id="scrollDown">
            <h6>Slide Down</h6>
            <div class="line"></div>
        </div>
    </section>
<section class="contact-area mt-30 section-padding-100-0">
        <div class="container">

            <div class="row">


                <div class="col-12 col-lg-6">
                    <div class="contact-content mb-100">
                        <!-- Contact Form Area -->
                        <div class="contact-form-area">
                            {% if messages %}
<!--<div class="alert-messages">-->
<!--    {% for message in messages %}-->
<!--&lt;!&ndash;        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">&ndash;&gt;-->
<!--            {{ message }}-->
<!--        </div>-->
<!--    {% endfor %}-->

                            {% for message in messages %}
    <div style="color: green;">
        {{ message }}
    </div>
{% endfor %}

</div>
{% endif %}
                            <form method="POST" id="contactForm" name="contactForm" class="contactForm">
										{% csrf_token %}
										<div class="row">
											<div class="col-md-8">
												<div class="form-group">
                                                    <h6 style="color:red">{{msg}}</h6>
													<label class="label" for="email">Email Address</label>
													<input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
												</div>
											</div>
											<div class="col-md-8">
												<div class="form-group">
													<label class="label" for="password">Password</label>
													<input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
												</div>
											</div>
											<div class="col-md-12">
												<div class="form-group">
													<input type="submit" value="Login" class="btn btn-primary">
                                                    <div class="submitting">

</div>

												</div>
											</div>
										</div>
									</form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
{% include 'footer.html' %}
