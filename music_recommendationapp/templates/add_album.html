{% load static %}
{% include 'admin_header.html' %}
<!-- ##### Hero Area Start ##### -->
<section class="hero-area">
    <div class="hero-slides owl-carousel">
        <div class="single-hero-slide d-flex align-items-center justify-content-center">
            <!-- Slide Img -->
            <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-3.jpg' %});"></div>
            <!-- Slide Content -->
            <div class="hero-slides-content text-center">
                <p data-animation="fadeInUp" data-delay="300ms">Add Album</p>
            </div>
        </div>
    </div>
    <!-- bg gradients -->
    <div class="bg-gradients"></div>
    <!-- Slide Down -->
    <div class="slide-down" id="scrollDown">
        <h6>Slide Down</h6>
        <div class="line"></div>
    </div>
</section>

<section class="contact-area mt-30 section-padding-100-0">
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-6">
                <div class="contact-content mb-100">
                    <!-- Contact Form Area -->
                    <div class="contact-form-area">
                        <!-- Display the message if available -->
                        <h6 style="color:green">{{ msg }}</h6>

                        <form method="POST" id="contactForm" action="" name="contactForm" class="contactForm" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" >Email Address</label>
                                        <input type="email" class="form-control" name="email" value="{{email}}" readonly required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="title">Title</label>
                                        <input type="text" class="form-control" name="title" id="title" placeholder="Title" required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="production">Production</label>
                                        <input type="text" class="form-control" name="production" id="production" placeholder="Production" required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="language">Language</label>
                                        <input type="text" class="form-control" name="language" id="language" placeholder="Language" required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="year">Year</label>
                                        <input type="number" class="form-control" name="year" id="year" placeholder="Year" required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" for="track">No. of Tracks</label>
                                        <input type="number" class="form-control" name="tracks" id="track" placeholder="No. of Tracks" required>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label class="label" >Upload Image</label>
                                        <input type="file" class="form-control" name="image" required>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <div class="form-group">
                                        <input type="submit" value="Add Album" class="btn btn-primary">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% include 'footer.html' %}
