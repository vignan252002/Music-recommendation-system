{% load static %}
{% include 'header.html' %}

<section class="hero-area" style="height: 300px;">
    <div class="hero-slides owl-carousel">
        <div class="single-hero-slide d-flex align-items-center justify-content-center" style="height: 300px;">
            <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-3.jpg' %});"></div>
            <div class="hero-slides-content text-center">
                <h2 data-animation="fadeInUp" data-delay="300ms" class="mt-5" style="color: white; font-size: 36px;">Create New Password</h2>
            </div>
        </div>
    </div>
    <div class="bg-gradients"></div>
</section>

<div class="about-us-area section-padding-100-0">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6">
                <div class="about--content mb-50 text-center" style="background: #f8f9fa; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                    <h4>Set New Password</h4>
                    <p class="mb-4">Please enter your new password below.</p>

                    {% if messages %}
                        <div class="messages mb-4 text-left">
                            {% for message in messages %}
                                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST" action="{% url 'reset_password' %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="New Password" required style="height: 50px;">
                        </div>
                        <div class="form-group mb-4">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required style="height: 50px;">
                        </div>
                        <button type="submit" class="btn w-100" style="background-color: #000; color: #fff; padding: 15px; font-size: 18px; font-weight: 600; border-radius: 0;">UPDATE PASSWORD</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
