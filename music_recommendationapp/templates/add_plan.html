{% load static %}
{% include 'admin_header.html' %}
    <!-- ##### Hero Area Start ##### -->
    <section class="hero-area">
        <div class="hero-slides owl-carousel">

            <!-- Single Hero Slide -->
            <div class="single-hero-slide d-flex align-items-center justify-content-center">
                <!-- Slide Img -->
                <div class="slide-img bg-img" style="background-image: url({% static 'img/bg-img/bg-1.jpg' %});"></div>
                <!-- Slide Content -->
                <div class="hero-slides-content text-center">
                    <p data-animation="fadeInUp" data-delay="300ms">Admin Add Plan</p>
                </div>
            </div>

        </div>
        <!-- bg gradients -->
        <div class="bg-gradients"></div>

        <!-- Slide Down -->
        <div class="slide-down" id="scrollDown">
            <h6>Slide Down</h6>
            <div class="line"></div>
        </div>
    </section>
<section class="contact-area mt-30 section-padding-100-0">
        <div class="container">

            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="contact-content mb-100">
                        <!-- Contact Form Area -->
                        <div class="contact-form-area">
                            <form method="POST" id="contactForm" action="{% url 'add_plan' %}" name="contactForm" class="contactForm">
                                        {% csrf_token %}
										<div class="row">

											<div class="col-md-8">
												<div class="form-group">
													<label class="label" for="email">Email</label>
													<input type="email" class="form-control" name="email"  id="email" value="{{email}}"  readonly>
												</div>
											</div>
                                            <div class="col-md-8">
												<div class="form-group">
													<label class="label" >Title</label>
													<input type="text" class="form-control" name="title"  placeholder="Title" required>
												</div>
											</div>
                                            <div class="col-md-8">
												<div class="form-group">
													<label class="label" >Months</label>
													<input type="number" class="form-control"  name="months" placeholder="Months" required>
												</div>
											</div>
                                            <div class="col-md-8">
												<div class="form-group">
													<label class="label" >Cost</label>
													<input type="number" class="form-control"  name="cost" placeholder="Cost" required>
												</div>
											</div>
                                            <div class="col-md-8">
												<div class="form-group">
													<label class="label" >Discount</label>
													<input type="number" class="form-control"  name="discount" placeholder="Discount" required>
												</div>
											</div>

											<div class="col-md-12">
												<div class="form-group">
													<input type="submit" value="Add plan" class="btn btn-primary">
												</div>
											</div>
										</div>
									</form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% include 'footer.html' %}
